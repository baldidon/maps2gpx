<main class="max-w-xl mx-auto px-4 py-8">
  <header class="text-center mb-8">
    <h1 class="text-4xl font-bold text-blue-600 mb-1">maps2gpx</h1>
    <p class="text-slate-500 text-base">Converti un percorso Google Maps in file GPX</p>
  </header>

  <app-route-form
    [url]="url()"
    (urlInput)="onUrlInput($event)"
    [profile]="profile()"
    (profileChange)="profile.set($event)"
    [routeName]="routeName()"
    (routeNameChange)="routeName.set($event)"
    [waypoints]="waypoints()"
    [error]="error()"
    [loading]="loading()"
    [resolving]="resolving()"
    (generateClick)="generateGpx()"
  />

  @if (result()) {
    <app-route-result
      [result]="result()!"
      (downloadClick)="downloadGpx()"
    />
  }

  <footer class="mt-8 text-center text-slate-500 text-sm">
    <p>
      Incolla qualsiasi link Google Maps: percorso con coordinate, short link
      <code class="bg-white px-1.5 py-0.5 rounded text-xs border border-slate-200">maps.app.goo.gl/...</code>, o link completo da "Condividi"
    </p>
  </footer>
</main>
